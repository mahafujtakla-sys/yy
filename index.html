<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f4f7f8">

  <title>洪山区文体中心游泳馆实时入场码</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: light;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));

      background: #f4f7f8;
      color: #162126;
    }

    main {
      width: min(100%, 520px);

      padding: 30px 22px;

      background: #ffffff;

      border-radius: 22px;

      box-shadow:
        0 18px 60px rgba(18, 55, 68, 0.13);

      text-align: center;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 24px;

      color: #65747a;

      font-size: 16px;
    }

    .qr-wrap {
      position: relative;

      width: 100%;
      min-height: 340px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #dfe8eb;
      border-radius: 18px;

      background: #ffffff;

      overflow: hidden;
    }

    #qr {
      display: none;

      width: min(78vw, 340px);
      height: min(78vw, 340px);

      object-fit: contain;
      image-rendering: pixelated;
    }

    #placeholder {
      padding: 30px;

      color: #89969b;

      font-size: 15px;
      line-height: 1.6;
    }

    #status {
      min-height: 24px;

      margin: 18px 0 14px;

      color: #28798b;

      font-size: 15px;
      line-height: 1.5;
    }

    #status.error {
      color: #c0392b;
    }

    button {
      appearance: none;

      border: 0;
      border-radius: 999px;

      padding: 12px 28px;

      background: #00a8bf;
      color: #ffffff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .note {
      margin: 18px 0 0;

      color: #89969b;

      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px 18px;
      }

      h1 {
        font-size: 22px;
      }

      .qr-wrap {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>
      洪山区文体中心游泳馆
    </h1>

    <p class="subtitle">
      实时入场二维码
    </p>

    <div class="qr-wrap">

      <img
        id="qr"
        alt="实时入场二维码"
      >

      <div id="placeholder">
        正在获取二维码…
      </div>

    </div>

    <div id="status">
      正在连接服务器…
    </div>

    <button
      id="refresh"
      type="button"
    >
      立即刷新
    </button>

    <p class="note">
      页面每 15 秒自动更新。
      网络异常时继续保留上一次成功获取的二维码。
    </p>

  </main>


  <script>

    // =========================================================
    // 腾讯云 CloudBase API 地址
    // =========================================================

    const API =
      "https://qr-proxy-d6gmwq26043bad167-1471108776.ap-shanghai.app.tcloudbase.com/qr";


    // 每 15 秒刷新
    const REFRESH_INTERVAL_MS = 15_000;

    // 单次请求最多等待 10 秒
    const REQUEST_TIMEOUT_MS = 10_000;


    const qrImage =
      document.getElementById("qr");

    const placeholder =
      document.getElementById("placeholder");

    const status =
      document.getElementById("status");

    const refreshButton =
      document.getElementById("refresh");


    let isRefreshing = false;
    let hasSuccessfulQr = false;


    function setStatus(text, error = false) {
      status.textContent = text;
      status.classList.toggle("error", error);
    }


    async function refreshQr() {

      if (isRefreshing) {
        return;
      }

      isRefreshing = true;
      refreshButton.disabled = true;

      setStatus("正在获取最新二维码…");

      if (!hasSuccessfulQr) {
        placeholder.textContent =
          "正在获取二维码…";
      }


      const controller =
        new AbortController();

      const timeoutId =
        setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS
        );


      try {

        const requestUrl =
          API +
          "?t=" +
          Date.now();


        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",
              cache: "no-store",
              signal: controller.signal
            }
          );


        if (!response.ok) {

          let message =
            `HTTP ${response.status}`;

          try {
            const errorResult =
              await response.json();

            if (errorResult?.message) {
              message =
                errorResult.message;
            }
          } catch (_) {}

          throw new Error(message);
        }


        const result =
          await response.json();


        /*
          腾讯云函数返回格式：

          {
            "status": 0,
            "qr": "data:image/png;base64,..."
          }
        */


        if (
          result.status !== 0 ||
          !result.qr
        ) {
          throw new Error(
            result.message ||
            "服务器没有返回二维码"
          );
        }


        const qrData =
          decodeURIComponent(
            result.qr
          );


        if (
          !qrData.startsWith(
            "data:image/"
          )
        ) {
          throw new Error(
            "二维码数据格式异常"
          );
        }


        qrImage.src =
          qrData;

        qrImage.style.display =
          "block";

        placeholder.style.display =
          "none";


        hasSuccessfulQr =
          true;


        setStatus(
          "已更新：" +
          new Date()
            .toLocaleTimeString()
        );

      }

      catch (error) {

        console.error(
          "QR refresh failed:",
          error
        );


        if (
          error?.name ===
          "AbortError"
        ) {

          if (hasSuccessfulQr) {
            setStatus(
              "本次刷新超时，继续显示上一次二维码",
              true
            );
          } else {
            placeholder.textContent =
              "服务器响应较慢，请点击“立即刷新”重试";

            setStatus(
              "获取超时，请重试",
              true
            );
          }

        } else {

          const message =
            error instanceof Error
              ? error.message
              : String(error);


          if (hasSuccessfulQr) {

            setStatus(
              "刷新失败，继续显示上一次二维码",
              true
            );

          } else {

            placeholder.textContent =
              "暂时无法获取二维码";

            setStatus(
              "获取失败：" +
              message,
              true
            );

          }

        }

      }

      finally {

        clearTimeout(
          timeoutId
        );

        isRefreshing =
          false;

        refreshButton.disabled =
          false;

      }

    }


    refreshButton.addEventListener(
      "click",
      refreshQr
    );


    // 页面打开后立即获取
    refreshQr();


    // 每 15 秒自动刷新
    setInterval(
      refreshQr,
      REFRESH_INTERVAL_MS
    );


    // 手机重新切回 Safari 时立即刷新
    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "visible"
        ) {
          refreshQr();
        }

      }
    );

  </script>

</body>
</html>

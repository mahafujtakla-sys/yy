<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f4f7f8">

  <title>洪山区文体中心游泳馆实时入场码</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: light;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));

      background: #f4f7f8;
      color: #162126;
    }

    main {
      width: min(100%, 520px);

      padding: 30px 22px;

      background: #ffffff;

      border-radius: 22px;

      box-shadow:
        0 18px 60px rgba(18, 55, 68, 0.13);

      text-align: center;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 24px;

      color: #65747a;

      font-size: 16px;
    }

    .qr-wrap {
      position: relative;

      width: 100%;
      min-height: 340px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #dfe8eb;
      border-radius: 18px;

      background: #ffffff;

      overflow: hidden;
    }

    #qr {
      display: none;

      width: min(78vw, 340px);
      height: min(78vw, 340px);

      object-fit: contain;

      image-rendering: pixelated;
    }

    #placeholder {
      padding: 30px;

      color: #89969b;

      font-size: 15px;
      line-height: 1.6;
    }

    #status {
      min-height: 24px;

      margin: 18px 0 14px;

      color: #28798b;

      font-size: 15px;
      line-height: 1.5;
    }

    #status.error {
      color: #c0392b;
    }

    button {
      appearance: none;

      border: 0;
      border-radius: 999px;

      padding: 12px 28px;

      background: #00a8bf;
      color: #ffffff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.55;

      cursor: default;
    }

    .note {
      margin: 18px 0 0;

      color: #89969b;

      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {

      main {
        padding: 26px 18px;
      }

      h1 {
        font-size: 22px;
      }

      .qr-wrap {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>
      洪山区文体中心游泳馆
    </h1>

    <p class="subtitle">
      实时入场二维码
    </p>


    <div class="qr-wrap">

      <img
        id="qr"
        alt="实时入场二维码"
      >

      <div id="placeholder">
        正在获取二维码…
      </div>

    </div>


    <div id="status">
      正在连接服务器…
    </div>


    <button
      id="refresh"
      type="button"
    >
      立即刷新
    </button>


    <p class="note">
    </p>

  </main>


  <script>

    // =========================================================
    // 修改这里：
    // 换成你自己的 Cloudflare Worker 地址
    // =========================================================

    const API =
      "https://qr-proxy-d6gmwq26043bad167-1471108776.ap-shanghai.app.tcloudbase.com/qr";


    // =========================================================
    // 设置
    // =========================================================

    // 每 15 秒自动刷新
    const REFRESH_INTERVAL_MS = 15_000;

    // 单次请求最多等待 8 秒
    const REQUEST_TIMEOUT_MS = 8_000;


    // =========================================================
    // 页面元素
    // =========================================================

    const qrImage =
      document.getElementById("qr");

    const placeholder =
      document.getElementById("placeholder");

    const status =
      document.getElementById("status");

    const refreshButton =
      document.getElementById("refresh");


    // 是否正在请求
    let isRefreshing = false;

    // 是否至少成功获取过一次二维码
    let hasSuccessfulQr = false;

    // 上次成功更新时间
    let lastSuccessTime = null;


    // =========================================================
    // 状态显示
    // =========================================================

    function setStatus(
      text,
      error = false
    ) {

      status.textContent = text;

      status.classList.toggle(
        "error",
        error
      );

    }


    // =========================================================
    // 获取二维码
    // =========================================================

    async function refreshQr() {

      // 防止上一次还没结束，
      // 下一次请求又开始。
      if (isRefreshing) {
        return;
      }


      isRefreshing = true;

      refreshButton.disabled = true;


      // 如果已经有二维码，
      // 刷新期间不要把旧二维码隐藏掉。
      if (hasSuccessfulQr) {

        setStatus(
          "正在获取最新二维码…"
        );

      } else {

        placeholder.textContent =
          "正在获取二维码…";

        setStatus(
          "正在获取最新二维码…"
        );

      }


      // -------------------------------------------------------
      // 8 秒超时
      // -------------------------------------------------------

      const controller =
        new AbortController();


      const timeoutId =
        setTimeout(
          () => {
            controller.abort();
          },
          REQUEST_TIMEOUT_MS
        );


      try {

        // 时间戳防止浏览器 / CDN 使用缓存
        const requestUrl =
          API +
          "?t=" +
          Date.now();


        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",

              cache: "no-store",

              signal:
                controller.signal
            }
          );


        // -----------------------------------------------------
        // HTTP 错误
        // -----------------------------------------------------

        if (!response.ok) {

          let message =
            `HTTP ${response.status}`;


          try {

            const errorResult =
              await response.json();


            if (
              errorResult &&
              errorResult.message
            ) {

              message =
                errorResult.message;

            }

          } catch (_) {
            // 返回内容不是 JSON 时，
            // 使用 HTTP 状态码。
          }


          throw new Error(message);

        }


        // -----------------------------------------------------
        // 解析 JSON
        // -----------------------------------------------------

        const result =
          await response.json();


        /*
          Worker 当前返回格式：

          {
            "data": {
              "qr":
                "data:image/png;base64,..."
            },
            "status": 0
          }
        */


        if (
          result.status !== 0 ||
          !result.qr
        ) {
          throw new Error(
            result.message ||
            "服务器没有返回二维码"
          );
        }


        // -----------------------------------------------------
        // 解码二维码
        // -----------------------------------------------------

        const qrData =
          decodeURIComponent(
            result.qr
          );


        if (
          !qrData.startsWith(
            "data:image/"
          )
        ) {

          throw new Error(
            "二维码数据格式异常"
          );

        }


        // -----------------------------------------------------
        // 显示二维码
        // -----------------------------------------------------

        qrImage.src = qrData;

        qrImage.style.display =
          "block";

        placeholder.style.display =
          "none";


        hasSuccessfulQr = true;

        lastSuccessTime =
          new Date();


        setStatus(
          "已更新：" +
          lastSuccessTime
            .toLocaleTimeString()
        );

      }


      // =======================================================
      // 请求失败
      // =======================================================

      catch (error) {

        console.error(
          "QR refresh failed:",
          error
        );


        // -----------------------------------------------------
        // 超时
        // -----------------------------------------------------

        if (
          error &&
          error.name === "AbortError"
        ) {

          if (hasSuccessfulQr) {

            setStatus(
              "本次刷新超时，继续显示上一次二维码",
              true
            );

          } else {

            placeholder.textContent =
              "服务器响应较慢，请点击“立即刷新”重试";

            setStatus(
              "获取超时，请重试",
              true
            );

          }

        }


        // -----------------------------------------------------
        // 其他错误
        // -----------------------------------------------------

        else {

          const message =
            error instanceof Error
              ? error.message
              : String(error);


          if (hasSuccessfulQr) {

            setStatus(
              "刷新失败，继续显示上一次二维码",
              true
            );

          } else {

            placeholder.textContent =
              "暂时无法获取二维码";

            setStatus(
              "获取失败：" +
              message,
              true
            );

          }

        }

      }


      // =======================================================
      // 请求结束
      // =======================================================

      finally {

        clearTimeout(
          timeoutId
        );


        isRefreshing = false;

        refreshButton.disabled =
          false;

      }

    }


    // =========================================================
    // 手动刷新
    // =========================================================

    refreshButton.addEventListener(
      "click",
      () => {

        refreshQr();

      }
    );


    // =========================================================
    // 页面打开立即获取
    // =========================================================

    refreshQr();


    // =========================================================
    // 每 15 秒自动刷新
    // =========================================================

    setInterval(
      () => {

        refreshQr();

      },
      REFRESH_INTERVAL_MS
    );


    // =========================================================
    // 手机从后台重新回到网页时立即刷新
    //
    // 例如：
    // Safari → 微信 → Safari
    //
    // 回来后不需要等待下一个 15 秒周期。
    // =========================================================

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.visibilityState ===
          "visible"
        ) {

          refreshQr();

        }

      }
    );

  </script>

</body>
</html>

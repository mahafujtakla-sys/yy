<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f4f7f8">

  <title>洪山区文体中心游泳馆实时入场码</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));

      background: #f4f7f8;
      color: #162126;
    }

    main {
      width: min(100%, 520px);

      padding: 30px 22px;

      background: #ffffff;
      border-radius: 22px;

      box-shadow:
        0 18px 60px rgba(18, 55, 68, 0.13);

      text-align: center;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0 0 24px;

      color: #65747a;
      font-size: 16px;
    }

    .qr-wrap {
      width: 100%;
      min-height: 340px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #dfe8eb;
      border-radius: 18px;

      background: #ffffff;

      overflow: hidden;
    }

    #qr {
      display: none;

      width: min(78vw, 340px);
      height: min(78vw, 340px);

      object-fit: contain;
      image-rendering: pixelated;
    }

    #placeholder {
      color: #89969b;
      font-size: 15px;
    }

    #status {
      min-height: 24px;

      margin: 18px 0 14px;

      color: #28798b;
      font-size: 15px;
      line-height: 1.5;
    }

    #status.error {
      color: #c0392b;
    }

    button {
      appearance: none;

      border: 0;
      border-radius: 999px;

      padding: 12px 26px;

      background: #00a8bf;
      color: #ffffff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .note {
      margin: 18px 0 0;

      color: #89969b;

      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px 18px;
      }

      h1 {
        font-size: 22px;
      }

      .qr-wrap {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>洪山区文体中心游泳馆</h1>

    <p class="subtitle">
      实时入场二维码
    </p>

    <div class="qr-wrap">
      <img
        id="qr"
        alt="实时入场二维码"
      >

      <div id="placeholder">
        正在获取二维码…
      </div>
    </div>

    <div id="status">
      正在连接服务器…
    </div>

    <button
      id="refresh"
      type="button"
    >
      立即刷新
    </button>

    <p class="note">
      页面每 10 秒自动获取最新二维码。
    </p>

  </main>


  <script>

    // =========================================================
    // 只修改这里
    // 换成你自己的 Cloudflare Worker 地址
    // =========================================================

    const API =
      "https://你的-worker地址.workers.dev";


    // 每 10 秒刷新一次
    const REFRESH_INTERVAL_MS = 10_000;


    const qrImage =
      document.getElementById("qr");

    const placeholder =
      document.getElementById("placeholder");

    const status =
      document.getElementById("status");

    const refreshButton =
      document.getElementById("refresh");


    function setStatus(text, error = false) {

      status.textContent = text;

      status.classList.toggle(
        "error",
        error
      );

    }


    async function refreshQr() {

      refreshButton.disabled = true;

      setStatus(
        "正在获取最新二维码…"
      );


      try {

        // 加时间戳，避免浏览器缓存
        const url =
          API +
          "?t=" +
          Date.now();


        const response =
          await fetch(
            url,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          let message =
            `HTTP ${response.status}`;

          try {

            const errorData =
              await response.json();

            if (errorData.message) {
              message =
                errorData.message;
            }

          } catch (_) {}

          throw new Error(message);
        }


        const result =
          await response.json();


        // -------------------------------------------------------
        // Worker 当前返回的是场馆原始 JSON：
        //
        // {
        //   "data": {
        //      "qr": "data:image/png;base64,..."
        //   },
        //   "status": 0
        // }
        // -------------------------------------------------------

        if (
          result.status !== 0 ||
          !result.data ||
          !result.data.qr
        ) {

          throw new Error(
            result.message ||
            "服务器没有返回二维码"
          );

        }


        // 场馆返回的数据经过 URL 编码，
        // 例如 %2F、%2B 等，需要先 decode。
        const qrData =
          decodeURIComponent(
            result.data.qr
          );


        if (
          !qrData.startsWith(
            "data:image/"
          )
        ) {

          throw new Error(
            "二维码数据格式异常"
          );

        }


        qrImage.src = qrData;

        qrImage.style.display =
          "block";

        placeholder.style.display =
          "none";


        setStatus(
          "已更新：" +
          new Date()
            .toLocaleTimeString()
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          "获取失败：" +
          (
            error instanceof Error
              ? error.message
              : String(error)
          ),
          true
        );

      }

      finally {

        refreshButton.disabled =
          false;

      }

    }


    // 手动刷新
    refreshButton.addEventListener(
      "click",
      refreshQr
    );


    // 页面打开立即获取一次
    refreshQr();


    // 每 10 秒自动更新
    setInterval(
      refreshQr,
      REFRESH_INTERVAL_MS
    );

  </script>

</body>
</html>
